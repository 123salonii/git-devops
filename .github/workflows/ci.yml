name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check HTML file
        run: |
          test -f index.html
          echo "index.html exists"

      - name: Display project information
        run: |
          echo "GitHub Actions is working!"
          echo "Project: Git DevOps Homework"